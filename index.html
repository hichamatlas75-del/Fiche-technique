<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grey Corner — Fiches Techniques Cuisine</title>

<style>
  :root {
    --bg: #0b0e12;       /* fond sombre */
    --paper: #12161c;    /* cartes */
    --paper-hover: #161c24;
    --text: #e7edf6;     /* texte principal */
    --muted: #9aa8bb;    /* texte secondaire */
    --border: #1c232c;
    --chip: #1a2330;
    --ok: #22c55e;
    --warn: #facc15;
    --danger: #ef4444;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    scroll-behavior: smooth;
  }
  img { max-width: 100%; display: block; }
  button { cursor: pointer; font-family: inherit; }
  input { font-family: inherit; }

  .container { max-width: 1240px; margin: 0 auto; padding: 12px 16px; }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    background: rgba(11, 14, 18, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    z-index: 50;
  }
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f141b;
    object-fit: cover;
  }
  .ttl {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .4px;
    color: var(--text);
  }
  .ttl span { color: var(--accent); }

  /* SEARCH BAR */
  .search-box {
    display: flex;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    gap: 8px;
    min-width: 260px;
    max-width: 420px;
    flex: 1;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }
  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    width: 100%;
  }
  .search-box input::placeholder { color: #64748b; }
  .search-clear {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .search-clear.visible { display: flex; }
  .search-clear:hover { color: var(--text); }

  /* NAVIGATION TABS */
  nav {
    position: sticky;
    top: 63px;
    z-index: 40;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: thin;
  }
  .tabs { display: flex; gap: 4px; padding: 0 8px; }
  .tab {
    padding: 12px 14px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 700;
    font-size: 14px;
    border-bottom: 3px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color .2s, border-color .2s;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); }

  /* Tab active indicators */
  .tab[data-color].active { border-bottom-color: currentColor; }
  .tab[data-color="#ef476f"] { color: #ef476f; }
  .tab[data-color="#22a699"] { color: #22a699; }
  .tab[data-color="#ffb703"] { color: #ffb703; }
  .tab[data-color="#64b5f6"] { color: #64b5f6; }
  .tab[data-color="#b088f9"] { color: #b088f9; }
  .tab[data-color="#f97316"] { color: #f97316; }
  .tab[data-color="#06b6d4"] { color: #06b6d4; }
  .tab[data-color="#10b981"] { color: #10b981; }
  .tab[data-color="#eab308"] { color: #eab308; }
  .tab[data-color="#fb7185"] { color: #fb7185; }

  /* STATS & SEARCH SUMMARY */
  .search-info {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
    display: none;
  }
  .search-info.visible { display: block; }
  .search-info strong { color: var(--accent); }

  /* SECTIONS & GRID */
  .section-wrap { scroll-margin-top: 120px; }
  .section-title {
    font-size: 24px;
    font-weight: 800;
    margin: 28px 0 16px;
    text-transform: uppercase;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-count {
    font-size: 13px;
    font-weight: 700;
    background: var(--chip);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 20px;
    padding-bottom: 32px;
  }

  /* CARDS */
  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
    display: flex;
    flex-direction: column;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover {
    border-color: #2a3647;
  }
  .hero-wrap {
    position: relative;
    width: 100%;
    height: 195px;
    background: #0f141b;
    overflow: hidden;
  }
  .hero {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-bottom: 2px solid var(--border);
    cursor: zoom-in;
    transition: transform .25s ease;
  }
  .hero:hover { transform: scale(1.03); }
  .gallery-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(11, 14, 18, 0.85);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }

  .body {
    padding: 16px 14px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .3px;
    line-height: 1.3;
  }
  .price {
    font-weight: 800;
    font-size: 14px;
    background: var(--chip);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    color: #38bdf8;
  }

  /* TIMER */
  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 12px;
    padding: 6px 10px;
    background: rgba(0,0,0,.25);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.04);
  }
  .timer {
    font-weight: 800;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: .5px;
  }
  .timer .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #64748b;
  }
  .timer[data-state="run"] .dot {
    background: var(--warn);
    box-shadow: 0 0 0 0 rgba(250,204,21,.8);
    animation: pulse 1.3s infinite;
  }
  .timer[data-state="done"] .dot {
    background: var(--ok);
    animation: none;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(250,204,21,.8); }
    70% { box-shadow: 0 0 0 10px rgba(250,204,21,0); }
    100% { box-shadow: 0 0 0 0 rgba(250,204,21,0); }
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .chip {
    background: var(--chip);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
  }

  /* TECH RECIPE LIST */
  .tech {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    color: #cbd5e1;
    font-size: 13.5px;
    list-style: none;
    flex: 1;
  }
  .tech li {
    margin: 3px 0;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px dotted rgba(255,255,255,.05);
    padding-bottom: 2px;
  }
  .tech li .item-qty {
    font-weight: 700;
    color: #f1f5f9;
  }

  /* CARD FOOTER */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: #0f141b;
  }
  .badge {
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 12px;
    border: 1px solid transparent;
    user-select: none;
    letter-spacing: .4px;
    transition: transform .1s, opacity .15s;
  }
  .badge:active { transform: scale(0.96); }
  .badge.todo { background: var(--danger); color: #fff; }
  .badge.prog { background: var(--warn); color: #1e293b; }
  .badge.ready { background: var(--ok); color: #fff; }

  /* LIGHTBOX */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    flex-direction: column;
    padding: 16px;
  }
  .lightbox.visible { display: flex; }
  #lightbox-img {
    max-width: 92%;
    max-height: 84%;
    border-radius: 12px;
    border: 1px solid #223042;
    box-shadow: 0 0 30px rgba(0,0,0,.8);
    object-fit: contain;
  }
  .lb-counter {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }
  .lb-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    font-size: 26px;
    padding: 12px 18px;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    transition: background .2s;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, 0.3); }
  .prev { left: 4%; }
  .next { right: 4%; }
  .close {
    top: 20px;
    right: 24px;
    transform: none;
    font-size: 24px;
    padding: 8px 14px;
  }

  @media (max-width: 768px) {
    .head { flex-direction: column; align-items: stretch; }
    .search-box { min-width: 100%; }
    .prev { left: 2%; }
    .next { right: 2%; }
  }
</style>
</head>

function normalizeImagesField(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(Boolean);
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const rs = s % 60;
  return `${m}:${rs < 10 ? '0' : ''}${rs}`;
}

// Nettoyage clé UID safe
function makeItemKey(catKey, itemName) {
  return 'item_' + catKey + '_' + itemName.toLowerCase().replace(/[^a-z0-9]/g, '_');
}

function createCard(item, catKey, categoryColor) {
  const itemKey = makeItemKey(catKey, item.name);
  const gallery = item.__images && item.__images.length > 0 ? item.__images : [item.image || PLACEHOLDER_SVG];
  const firstImg = gallery[0] || PLACEHOLDER_SVG;
  const timerInit = formatTime(item.prepTime * 60);

  const techHtml = (item.tech || []).map(line => {
    const parts = line.split(':');
    if (parts.length > 1) {
      return `<li><span>${parts[0].trim()}</span> <span class="item-qty">${parts.slice(1).join(':').trim()}</span></li>`;
    }
    return `<li><span>${line}</span></li>`;
  }).join('');

  const multiBadge = gallery.length > 1 ? `<span class="gallery-badge">📸 ${gallery.length} photos</span>` : '';

  return `
    <div class="card" data-key="${itemKey}" data-search="${(item.name + ' ' + (item.tech||[]).join(' ')).toLowerCase()}">
      <div class="hero-wrap">
        <img class="hero" src="${firstImg}" alt="${item.name}" data-gallery="${gallery.join('|')}" style="border-bottom-color:${categoryColor}" onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG}';">
        ${multiBadge}
      </div>
      <div class="body">
        <div class="row-top">
          <div class="name">${item.name}</div>
          <div class="price">${item.price || ''}</div>
        </div>

        <div class="timer-row">
          <div class="timer" id="${itemKey}-timer" data-state="idle">
            <span class="dot"></span>
            <span class="time" data-seconds="${item.prepTime * 60}">${timerInit}</span>
          </div>
          <div class="meta">
            <span class="chip mins">⏱️ ${item.prepTime} min</span>
          </div>
        </div>

        <ul class="tech">${techHtml}</ul>
      </div>
      <div class="footer">
        <span class="chip">FT Standard</span>
        <span class="badge todo" id="${itemKey}-badge" data-key="${itemKey}" data-status="to-do">À FAIRE</span>
      </div>
    </div>
  `;
}

function renderAll() {
  tabs.innerHTML = '';
  sectionsContainer.innerHTML = '';

  DATA.forEach(cat => {
    cat.items.forEach(it => {
      it.__key = cat.key;
      it.__images = normalizeImagesField(it.images || (it.image ? [it.image] : []));
    });

    // Tab link
    const t = document.createElement('a');
    t.href = `#${cat.key}`;
    t.className = 'tab';
    t.dataset.color = cat.color;
    t.dataset.cat = cat.key;
    t.textContent = `${cat.category} (${cat.items.length})`;
    tabs.appendChild(t);
    if (tabs.children.length === 1) t.classList.add('active');

    // Section container
    const sec = document.createElement('section');
    sec.id = cat.key;
    sec.className = 'section-wrap';
    sec.dataset.cat = cat.key;
    sec.innerHTML = `
      <h2 class="section-title" style="color:${cat.color}">
        ${cat.category}
        <span class="section-count">${cat.items.length} fiches</span>
      </h2>
      <div class="grid">
        ${cat.items.map(it => createCard(it, cat.key, cat.color)).join('')}
      </div>
    `;
    sectionsContainer.appendChild(sec);
  });

  initTabBehavior();
  initCardsBehavior();
  initSearch();
  restoreSavedTimers();
}

/* ===============================
   GESTION DES ONGLETS
================================= */
function initTabBehavior() {
  const allTabs = [...document.querySelectorAll('.tab')];
  allTabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      const id = tab.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (!target) return;
      allTabs.forEach(x => x.classList.remove('active'));
      tab.classList.add('active');
      const y = target.getBoundingClientRect().top + window.scrollY - 115;
      window.scrollTo({ top: y, behavior: 'smooth' });
    });
  });
}

/* ===============================
   MOTEUR DE RECHERCHE RAPIDE
================================= */
function initSearch() {
  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    searchClear.classList.toggle('visible', q.length > 0);

    const cards = document.querySelectorAll('.card');
    const sections = document.querySelectorAll('.section-wrap');
    let matchesCount = 0;

    if (!q) {
      cards.forEach(c => c.style.display = '');
      sections.forEach(s => s.style.display = '');
      searchInfo.classList.remove('visible');
      return;
    }

    sections.forEach(sec => {
      let secMatches = 0;
      const secCards = sec.querySelectorAll('.card');
      secCards.forEach(card => {
        const text = card.dataset.search || '';
        const match = text.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) {
          secMatches++;
          matchesCount++;
        }
      });
      sec.style.display = secMatches > 0 ? '' : 'none';
    });

    searchInfo.innerHTML = `Résultat pour "<strong>${q}</strong>" : <strong>${matchesCount}</strong> fiche(s) trouvée(s).`;
    searchInfo.classList.add('visible');
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchInput.dispatchEvent(new Event('input'));
    searchInput.focus();
  });
}

/* ===============================
   SONS & SYNTHÉTISEUR AUDIO WEB
================================= */
const sndStart = document.getElementById('snd-start');
const sndDone  = document.getElementById('snd-done');
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// Bip synthétisé si fichier audio absent ou bloqué
function playSynthBeep(type) {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;

    if (type === 'start') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else { // done
      [0, 0.18, 0.36].forEach((delay, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        const freq = 660 + (i * 220);
        osc.frequency.setValueAtTime(freq, now + delay);
        gain.gain.setValueAtTime(0.4, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.25);
        osc.start(now + delay);
        osc.stop(now + delay + 0.25);
      });
    }
  } catch (err) {
    console.log("Synth audio indisponible", err);
  }
}

function playSound(audioEl, type) {
  if (audioEl) {
    audioEl.pause();
    audioEl.currentTime = 0;
    const p = audioEl.play();
    if (p !== undefined) {
      p.catch(() => playSynthBeep(type));
      return;
    }
  }
  playSynthBeep(type);
}

document.body.addEventListener('click', () => {
  getAudioContext();
  if (sndStart) sndStart.load();
  if (sndDone) sndDone.load();
}, { once: true });

/* ===============================
   TIMERS & LOCALSTORAGE
================================= */
const runningTimers = new Map();

function saveTimerState(key, status, endsAt, totalSec) {
  try {
    const raw = localStorage.getItem('gc_kitchen_state') || '{}';
    const state = JSON.parse(raw);
    if (status === 'to-do') {
      delete state[key];
    } else {
      state[key] = { status, endsAt, totalSec };
    }
    localStorage.setItem('gc_kitchen_state', JSON.stringify(state));
  } catch (e) {}
}

function restoreSavedTimers() {
  try {
    const raw = localStorage.getItem('gc_kitchen_state');
    if (!raw) return;
    const state = JSON.parse(raw);
    const now = Date.now();

    Object.keys(state).forEach(key => {
      const item = state[key];
      const badge = document.getElementById(key + '-badge');
      const tEl = document.getElementById(key + '-timer');
      if (!badge || !tEl) return;

      if (item.status === 'prog') {
        const remainSec = Math.round((item.endsAt - now) / 1000);
        if (remainSec > 0) {
          setBadge(badge, 'prog');
          startTimer(key, remainSec, item.endsAt);
        } else {
          setBadge(badge, 'ready');
          tEl.dataset.state = 'done';
          const timeEl = tEl.querySelector('.time');
          timeEl.textContent = "0:00";
        }
      } else if (item.status === 'ready') {
        setBadge(badge, 'ready');
        tEl.dataset.state = 'done';
        const timeEl = tEl.querySelector('.time');
        timeEl.textContent = "0:00";
      }
    });
  } catch (e) {}
}

function startTimer(key, remainingSeconds = null, targetEndTime = null) {
  const tEl = document.getElementById(key + '-timer');
  if (!tEl) return;
  const timeEl = tEl.querySelector('.time');
  const baseSeconds = parseInt(timeEl.dataset.seconds, 10) || 600;
  let sec = remainingSeconds !== null ? remainingSeconds : baseSeconds;
  const endsAt = targetEndTime || (Date.now() + sec * 1000);

  tEl.dataset.state = 'run';
  playSound(sndStart, 'start');
  saveTimerState(key, 'prog', endsAt, baseSeconds);

  if (runningTimers.has(key)) clearInterval(runningTimers.get(key));

  const itv = setInterval(() => {
    const currentRemain = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
    timeEl.textContent = formatTime(currentRemain);

    if (currentRemain <= 0) {
      clearInterval(itv);
      runningTimers.delete(key);
      tEl.dataset.state = 'done';
      playSound(sndDone, 'done');
      const badge = document.getElementById(key + '-badge');
      if (badge) setBadge(badge, 'ready');
      saveTimerState(key, 'ready', endsAt, baseSeconds);
    }
  }, 1000);

  runningTimers.set(key, itv);
}

function stopTimer(key) {
  if (runningTimers.has(key)) {
    clearInterval(runningTimers.get(key));
    runningTimers.delete(key);
  }
  const tEl = document.getElementById(key + '-timer');
  if (tEl) tEl.dataset.state = 'idle';
}

function setBadge(el, status) {
  el.className = 'badge ' + status;
  el.dataset.status = status;
  el.textContent = status === 'to-do' ? 'À FAIRE' : status === 'prog' ? 'EN COURS' : 'PRÊT';
}

function initCardsBehavior() {
  document.querySelectorAll('.badge').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      const status = btn.dataset.status;
      const tEl = document.getElementById(key + '-timer');
      const timeEl = tEl.querySelector('.time');
      const baseSec = parseInt(timeEl.dataset.seconds, 10);

      if (status === 'to-do') {
        setBadge(btn, 'prog');
        startTimer(key);
      } else if (status === 'prog') {
        setBadge(btn, 'ready');
        stopTimer(key);
        tEl.dataset.state = 'done';
        saveTimerState(key, 'ready', Date.now(), baseSec);
      } else {
        setBadge(btn, 'to-do');
        stopTimer(key);
        tEl.dataset.state = 'idle';
        timeEl.textContent = formatTime(baseSec);
        saveTimerState(key, 'to-do', null, baseSec);
      }
    });
  });

  // Lightbox click
  document.querySelectorAll('.hero').forEach(img => {
    img.addEventListener('click', () => {
      const galleryAttr = img.dataset.gallery;
      currentGallery = galleryAttr ? galleryAttr.split('|').filter(Boolean) : [img.src];
      currentIndex = 0;
      showLightbox();
    });
  });
}

/* ===============================
   LIGHTBOX
================================= */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCounter = document.getElementById('lb-counter');
const lbClose = document.getElementById('lb-close');
const lbPrev = document.getElementById('lb-prev');
const lbNext = document.getElementById('lb-next');
let currentGallery = [];
let currentIndex = 0;

function showLightbox() {
  if (!currentGallery.length) return;
  lbImg.src = currentGallery[currentIndex];
  lbImg.onerror = () => { lbImg.src = PLACEHOLDER_SVG; };
  lb.classList.add('visible');
  const isMulti = currentGallery.length > 1;
  lbPrev.style.display = isMulti ? 'block' : 'none';
  lbNext.style.display = isMulti ? 'block' : 'none';
  lbCounter.style.display = isMulti ? 'block' : 'none';
  if (isMulti) {
    lbCounter.textContent = `${currentIndex + 1} / ${currentGallery.length}`;
  }
}

lbClose.onclick = () => lb.classList.remove('visible');
lbPrev.onclick = (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
  showLightbox();
};
lbNext.onclick = (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentGallery.length;
  showLightbox();
};
lb.onclick = (e) => {
  if (e.target === lb) lb.classList.remove('visible');
};
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('visible')) return;
  if (e.key === 'Escape') lb.classList.remove('visible');
  if (e.key === 'ArrowLeft') lbPrev.click();
  if (e.key === 'ArrowRight') lbNext.click();
});

// Lancement initial
renderAll();
</script>
