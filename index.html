<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grey Corner — Fiches Techniques Cuisine</title>

<!-- Styles Modulaires -->
<link rel="stylesheet" href="css/common.css?v=5.5" />
<link rel="stylesheet" href="css/kitchen.css?v=5.5" />

<!-- Données Centralisées (SSOT), Utilitaires & Composants -->
<script src="recipes-data.js?v=5.5"></script>
<script src="js/core-utils.js?v=5.5"></script>
<script src="js/prices-modal.js?v=5.5"></script>
</head>
<body>

<header>
  <div class="container head">
    <div class="brand">
      <img class="logo" src="images/logo.png" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'%230284c7\'%3E%3Cpath d=\'M50 15 L85 80 L15 80 Z\'/%3E%3Ctext x=\'50\' y=\'65\' font-size=\'32\' font-weight=\'bold\' fill=\'%23ffffff\' text-anchor=\'middle\'%3EGC%3C/text%3E%3C/svg%3E';" alt="GC">
      <div class="ttl">Grey Corner <span>Fiches Techniques</span></div>
    </div>
    <div class="search-box">
      <input id="search-input" type="search" placeholder="🔍 Rechercher un plat, ingrédient (poulet, wrap, burrata...)" autocomplete="off" />
      <button id="search-clear" class="search-clear" title="Effacer la recherche">✕</button>
    </div>
    <div class="header-actions">
      <button id="btn-wakelock" class="btn btn-secondary" title="Empêcher l'écran de la tablette de se mettre en veille en cuisine" onclick="window.toggleKitchenWakeLock()">💡 Écran Allumé</button>
      <button class="btn btn-secondary" onclick="window.openPricesModal()" title="Consulter et modifier la mercuriale des prix">💲 Prix Matières</button>
      <button id="theme-toggle" class="btn btn-secondary" title="Basculer le thème">🌓 Thème</button>
      <a href="consommation.html" class="btn btn-primary" style="text-decoration:none;">📊 Déstockage</a>
      <a href="audit.html" class="btn btn-secondary" style="text-decoration:none;">⚡ Audit Flash</a>
      <a href="comparateur.html" class="btn btn-secondary" style="text-decoration:none;">⚖️ Normes & Comparateur</a>
    </div>
  </div>
</header>

<nav>
  <div class="container">
    <!-- FILTRES RAPIDES EN CUISINE -->
    <div class="kitchen-quick-filters" id="kitchen-quick-filters">
      <button class="quick-filter-btn active" data-filter="all">🌟 Tous les plats</button>
      <button class="quick-filter-btn" data-filter="express">⏱️ Express (&le; 10 min)</button>
      <button class="quick-filter-btn" data-filter="photos">📸 Avec Photos</button>
      <button class="quick-filter-btn" data-filter="vege">🥗 Frais & Salades</button>
    </div>
    <div id="tabs" class="tabs"></div>
  </div>
</nav>

<main id="main" class="container">
  <div id="search-info" class="search-info"></div>
  <div id="sections-container"></div>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button id="lb-close" class="lb-btn close" title="Fermer">✕</button>
  <button id="lb-prev" class="lb-btn prev" title="Précédent">❮</button>
  <img id="lightbox-img" alt="Zoom plat" />
  <div id="lb-counter" class="lb-counter"></div>
  <button id="lb-next" class="lb-btn next" title="Suivant">❯</button>
</div>

<!-- Audio elements -->
<audio id="snd-start" preload="auto" src="sounds/START.mp3"></audio>
<audio id="snd-done" preload="auto" src="sounds/DONE.mp3"></audio>

<!-- Logique Métier Écran Cuisine -->
<script src="js/kitchen.js"></script>
</body>
</html>
