<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grey Corner — Fiches Techniques Cuisine</title>

<style>
  :root{
    --bg:#0b0e12;       /* fond sombre */
    --paper:#12161c;    /* cartes */
    --text:#e7edf6;     /* texte principal */
    --muted:#9aa8bb;    /* texte secondaire */
    --border:#1c232c;
    --chip:#1a2330;
    --ok:#22c55e;
    --warn:#facc15;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
  img{max-width:100%;display:block}
  button{cursor:pointer}

  .container{max-width:1200px;margin:0 auto;padding:12px 16px}

  header{position:sticky;top:0;background:#0b0e12cc;backdrop-filter:blur(6px);border-bottom:1px solid var(--border);z-index:50}
  .head{display:flex;align-items:center;gap:10px;padding:10px 0}
  .logo{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:#0f141b;object-fit:cover}
  .ttl{font-weight:800;letter-spacing:.3px}

  nav{position:sticky;top:62px;z-index:40;background:var(--paper);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
  .tabs{display:flex;gap:0;padding:0 8px}
  .tab{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px}
  .tab.active{color:var(--text);}

  .section-title{font-size:26px;font-weight:800;margin:28px 0 16px;text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:36px}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .hero{width:100%;height:190px;object-fit:cover;border-bottom:1px solid var(--border);cursor:zoom-in}

  .body{padding:14px 14px 10px}
  .row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .name{font-size:18px;font-weight:800;letter-spacing:.3px}
  .price{font-weight:800;background:var(--chip);border:1px solid var(--border);padding:4px 8px;border-radius:999px}

  .timer{margin:8px 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
  .timer .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 0 rgba(250,204,21,.8);animation:pulse 1.3s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(250,204,21,.8)}
    70%{box-shadow:0 0 0 10px rgba(250,204,21,0)}
    100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}
  }
  .timer[data-state="idle"] .dot{background:#64748b;animation:none}
  .timer[data-state="done"] .dot{background:var(--ok);animation:none}

  .meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .chip{background:var(--chip);border:1px solid var(--border);padding:3px 8px;border-radius:999px;font-weight:700}
  .mins{display:inline-flex;align-items:center;gap:6px}

  .tech{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;color:var(--muted);font-size:14px}
  .tech li{margin:2px 0}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--border);background:#0f141b}
  .badge{padding:6px 12px;border-radius:999px;font-weight:800;border:1px solid transparent;user-select:none}
  .todo{background:var(--danger);color:#fff}
  .prog{background:var(--warn);color:#1f2937}
  .ready{background:var(--ok);color:#fff}

  /* Lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column}
  .lightbox.visible{display:flex}
  #lightbox-img{max-width:92%;max-height:86%;border-radius:12px;border:1px solid #223042;box-shadow:0 0 20px rgba(255,255,255,.08);touch-action:none;cursor:grab}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;font-size:30px;padding:10px 16px;border-radius:10px}
  .lb-btn:hover{background:rgba(255,255,255,.25)}
  .prev{left:3%} .next{right:3%}
  .close{top:18px;right:22px;transform:none;font-size:26px}

  /* Couleurs par catégorie (surlignage onglet actif) */
  .tab[data-color].active{border-bottom-color:currentColor}
  .tab[data-color="#ef476f"]{color:#ef476f}
  .tab[data-color="#22a699"]{color:#22a699}
  .tab[data-color="#ffb703"]{color:#ffb703}
  .tab[data-color="#64b5f6"]{color:#64b5f6}
  .tab[data-color="#b088f9"]{color:#b088f9}
  .tab[data-color="#f97316"]{color:#f97316}
  .tab[data-color="#10b981"]{color:#10b981}
  .tab[data-color="#eab308"]{color:#eab308}
  .tab[data-color="#fb7185"]{color:#fb7185}
</style>
</head>

/* ===============================
   RENDU
================================= */
const tabs = document.getElementById('tabs');
const main = document.getElementById('main');

function isMultiImages(item){
  // multi uniquement pour Entrées (ef, ec) & Plats (pl)
  return ['ef','ec','pl'].includes(item.__key) && item.__images && item.__images.length>0;
}

function normalizeImagesField(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.filter(Boolean);
  // string "a,b,c"
  return raw.split(',').map(s=>s.trim()).filter(Boolean);
}

function createCard(item, categoryColor){
  // timer DOM id unique
  const uid = 't_'+Math.random().toString(36).slice(2,9);

  const techList = (item.tech||[]).map(x=>`<li>${x}</li>`).join('');
  const timerInit = formatTime(item.prepTime*60);

  // image logique
  let firstImg = item.image || (item.__images && item.__images[0]) || 'images/placeholder.jpg';

  return `
    <div class="card" data-id="${uid}">
      <img class="hero" src="${firstImg}" alt="${item.name}" data-gallery="${(item.__images||[]).join('|')}" style="border-bottom-color:${categoryColor}">
      <div class="body">
        <div class="row-top">
          <div class="name">${item.name}</div>
          <div class="price">${item.price||''}</div>
        </div>

        <!-- TIMER visible & animé -->
        <div class="timer" id="${uid}-timer" data-state="idle">
          <span class="dot"></span>
          <span class="time" data-seconds="${item.prepTime*60}">${timerInit}</span>
        </div>

        <div class="meta">
          <span class="chip mins">⏱️ ${item.prepTime} min</span>
        </div>

        <ul class="tech">${techList}</ul>
      </div>
      <div class="footer">
        <span class="chip">FT Standard</span>
        <span class="badge todo" id="${uid}-badge" data-status="to-do">À FAIRE</span>
      </div>
    </div>
  `;
}

function renderAll(){
  tabs.innerHTML = '';
  main.innerHTML = '';
  DATA.forEach(cat=>{
    // enrichir items: __key et __images
    cat.items.forEach(it=>{
      it.__key = cat.key;
      it.__images = normalizeImagesField(it.images);
    });

    // Tabs
    const t = document.createElement('a');
    t.href = `#${cat.key}`;
    t.className = 'tab';
    t.dataset.color = cat.color;
    t.textContent = cat.category;
    tabs.appendChild(t);
    if(tabs.children.length===1) t.classList.add('active');

    // Section
    const sec = document.createElement('section');
    sec.id = cat.key;
    sec.innerHTML = `
      <h2 class="section-title" style="color:${cat.color}">${cat.category}</h2>
      <div class="grid">
        ${cat.items.map(it=>createCard(it,cat.color)).join('')}
      </div>
    `;
    main.appendChild(sec);
  });

  initTabBehavior();
  initCardsBehavior();
}

/* ===============================
   ONGLET ACTIF
================================= */
function initTabBehavior(){
  const all = [...document.querySelectorAll('.tab')];
  all.forEach(tab=>{
    tab.addEventListener('click', (e)=>{
      e.preventDefault();
      const id = tab.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      all.forEach(x=>x.classList.remove('active'));
      tab.classList.add('active');
      const y = target.getBoundingClientRect().top + window.scrollY - 110;
      window.scrollTo({top:y,behavior:'smooth'});
    });
  });
}
/* ===============================
   TIMERS + STATUT + SONS (CORRIGÉ)
================================= */
const sndStart = document.getElementById('snd-start');
const sndDone  = document.getElementById('snd-done');
const timers = new Map(); 

// Débloquer l'audio au premier clic utilisateur
document.body.addEventListener('click', () => {
  sndStart.load();
  sndDone.load();
}, { once: true });

function playSound(audio) {
  audio.pause();
  audio.currentTime = 0;
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.catch(e => console.log("Audio bloqué ou manquant"));
  }
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const rs = s % 60;
  return `${m}:${rs < 10 ? '0' : ''}${rs}`;
}

function startTimer(uid) {
  const tEl = document.getElementById(uid + '-timer');
  const timeEl = tEl.querySelector('.time');
  let sec = parseInt(timeEl.dataset.seconds, 10);
  
  tEl.dataset.state = 'run';
  playSound(sndStart);

  if (timers.has(uid)) clearInterval(timers.get(uid).interval);

  const itv = setInterval(() => {
    sec--;
    timeEl.textContent = formatTime(sec);
    if (sec <= 0) {
      clearInterval(itv);
      tEl.dataset.state = 'done';
      playSound(sndDone);
      const badge = document.getElementById(uid + '-badge');
      setBadge(badge, 'ready');
    }
  }, 1000);
  timers.set(uid, { interval: itv });
}

function stopTimer(uid) {
  if (timers.has(uid)) {
    clearInterval(timers.get(uid).interval);
    timers.delete(uid);
  }
  const tEl = document.getElementById(uid + '-timer');
  if (tEl) tEl.dataset.state = 'idle';
}

function setBadge(el, status) {
  el.className = 'badge ' + status;
  el.dataset.status = status;
  el.textContent = status === 'to-do' ? 'À FAIRE' : status === 'prog' ? 'EN COURS' : 'PRÊT';
}

/* ===============================
   INTERACTIONS & LIGHTBOX
================================= */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lb-close');
const lbPrev = document.getElementById('lb-prev');
const lbNext = document.getElementById('lb-next');
let currentGallery = [];
let currentIndex = 0;

function initCardsBehavior() {
  document.querySelectorAll('.badge').forEach(btn => {
    btn.addEventListener('click', () => {
      const uid = btn.id.replace('-badge', '');
      if (btn.dataset.status === 'to-do') {
        setBadge(btn, 'prog');
        startTimer(uid);
      } else if (btn.dataset.status === 'prog') {
        setBadge(btn, 'ready');
        stopTimer(uid);
        const tEl = document.getElementById(uid + '-timer');
        tEl.dataset.state = 'done';
      } else {
        setBadge(btn, 'to-do');
        stopTimer(uid);
        const tEl = document.getElementById(uid + '-timer');
        const timeEl = tEl.querySelector('.time');
        timeEl.textContent = formatTime(parseInt(timeEl.dataset.seconds));
      }
    });
  });

  document.querySelectorAll('.hero').forEach(img => {
    img.addEventListener('click', () => {
      const galleryAttr = img.dataset.gallery;
      currentGallery = galleryAttr ? galleryAttr.split('|') : [img.src];
      currentIndex = 0;
      showLightbox();
    });
  });
}

function showLightbox() {
  lbImg.src = currentGallery[currentIndex];
  lb.classList.add('visible');
  lbPrev.style.display = currentGallery.length > 1 ? 'block' : 'none';
  lbNext.style.display = currentGallery.length > 1 ? 'block' : 'none';
}

lbClose.onclick = () => lb.classList.remove('visible');
lbPrev.onclick = () => { currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length; lbImg.src = currentGallery[currentIndex]; };
lbNext.onclick = () => { currentIndex = (currentIndex + 1) % currentGallery.length; lbImg.src = currentGallery[currentIndex]; };

// Lancement initial
renderAll();
</script>
