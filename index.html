<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Grey Corner — Fiches Techniques Cuisine</title>

<!-- Styles Modulaires du Design System -->
<link rel="stylesheet" href="css/common.css?v=7.7" />
<link rel="stylesheet" href="css/kitchen.css?v=7.7" />

<!-- Données Centralisées (SSOT), Utilitaires & Composants -->
<script src="recipes-data.js?v=7.7" defer></script>
<script src="js/core-utils.js?v=7.7" defer></script>
<script src="js/prices-modal.js?v=7.7" defer></script>
</head>
<body>

<!-- HEADER UNIFIÉ (Design System Grey Corner) -->
<header class="app-header">
  <div class="container app-header-content">
    <div class="app-brand">
      <div class="brand-badge">GC</div>
      <div class="brand-info">
        <div class="brand-title">Grey Corner <span>Cuisine</span></div>
        <div class="brand-subtitle">Fiches Techniques &amp; Standards Opérationnels</div>
      </div>
    </div>

    <!-- RECHERCHE INTÉGRÉE -->
    <div class="kitchen-search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="search" placeholder="Rechercher un plat, ingrédient (poulet, wrap, burrata...)" autocomplete="off" />
        <button id="search-clear" class="search-clear" title="Effacer la recherche">✕</button>
      </div>
    </div>

    <!-- ACTIONS RAPIDES CUISINE -->
    <div class="app-header-nav">
      <button id="btn-wakelock" class="btn btn-secondary" title="Empêcher l'écran de la tablette de se mettre en veille en cuisine" onclick="window.toggleKitchenWakeLock()">💡 Écran Allumé</button>
      <button class="btn btn-secondary" onclick="window.openPricesModal()" title="Consulter et modifier la mercuriale des prix">💲 Prix Matières</button>
      <button class="btn btn-secondary" onclick="window.forceCacheRefresh()" title="Forcer la mise à jour et recharger les dernières données">🔄 Actualiser</button>
      <button id="theme-toggle" class="btn btn-secondary" title="Basculer le mode sombre / clair">🌓 Thème</button>
      <a href="consommation.html" class="btn btn-primary" style="text-decoration:none;">📊 Déstockage</a>
      <a href="audit.html" class="btn btn-secondary" style="text-decoration:none;">⚡ Audit Flash</a>
      <a href="comparateur.html" class="btn btn-secondary" style="text-decoration:none;">⚖️ Normes &amp; Comparateur</a>
    </div>
  </div>
</header>

<!-- BANDEAU FILTRES RAPIDES -->
<div class="kitchen-filters-bar">
  <div class="container">
    <div class="kitchen-quick-filters" id="kitchen-quick-filters">
      <button class="quick-filter-btn active" data-filter="all">🌟 Tous les plats</button>
      <button class="quick-filter-btn" data-filter="express">⏱️ Express (&le; 10 min)</button>
      <button class="quick-filter-btn" data-filter="photos">📸 Avec Photos</button>
      <button class="quick-filter-btn" data-filter="vege">🥗 Frais &amp; Salades</button>
    </div>
  </div>
</div>

<!-- BARRE COLLANTE DES ONGLETS DE CATÉGORIES -->
<nav class="kitchen-nav">
  <div class="container">
    <div id="tabs" class="tabs"></div>
  </div>
</nav>

<!-- CONTENEUR PRINCIPAL -->
<main id="main" class="container">
  <div id="search-info" class="search-info"></div>

  <!-- SECTIONS CONTENEUR AVEC SKELETON LOADER PAR DÉFAUT -->
  <div id="sections-container">
    <div class="skeleton-grid" id="initial-skeleton-loader">
      <div class="skeleton-card">
        <div class="skeleton-hero"></div>
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line pill"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-hero"></div>
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line pill"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-hero"></div>
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line pill"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- LIGHTBOX ACCESSIBLE (AM-05 / AM-UI-07) -->
<div id="lightbox" class="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Galerie photo du plat"
     aria-live="polite">
  <button id="lb-close" class="lb-btn close" title="Fermer" aria-label="Fermer la galerie">✕</button>
  <button id="lb-prev" class="lb-btn prev" title="Précédent" aria-label="Photo précédente">❮</button>
  <img id="lightbox-img" alt="Zoom plat" />
  <div class="lb-caption-bar">
    <div id="lb-title" class="lb-title"></div>
    <div id="lb-counter" class="lb-counter" aria-live="polite"></div>
  </div>
  <button id="lb-next" class="lb-btn next" title="Suivant" aria-label="Photo suivante">❯</button>
</div>

<!-- BOUTON FLOTTANT RETOUR EN HAUT (AM-UI-08) -->
<button id="btn-scroll-top" class="btn-scroll-top" title="Retour en haut" aria-label="Retour en haut de page">↑</button>

<!-- ÉLÉMENTS AUDIO CUISINE -->
<audio id="snd-start" preload="auto" src="sounds/START.mp3"></audio>
<audio id="snd-done" preload="auto" src="sounds/DONE.mp3"></audio>

<!-- LOGIQUE MÉTIER ÉCRAN CUISINE -->
<script src="js/kitchen.js?v=7.7" defer></script>
</body>
</html>
