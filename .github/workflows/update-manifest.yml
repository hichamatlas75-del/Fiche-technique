name: Update Ventes Manifest

on:
  push:
    paths:
      - 'ventes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize sales by month and generate manifest.json
        run: |
          node ./scripts/organize_and_update_manifest.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ventes/manifest.json
          if git diff --staged --quiet; then
            echo 'No changes in manifest.json'
          else
            git commit -m 'chore: auto-update ventes/manifest.json [skip ci]'
            git push
          fi
