name: Update Ventes Manifest

on:
  push:
    paths:
      - 'ventes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = './ventes';
            if (fs.existsSync(dir)) {
              const files = fs.readdirSync(dir)
                .filter(f => (f.endsWith('.xls') || f.endsWith('.xlsx')) && f !== 'manifest.json')
                .sort();
              const today = new Date().toISOString().slice(0, 10);
              const manifest = { files, lastUpdated: today };
              fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
              console.log('Generated manifest with', files.length, 'files');
            }
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ventes/manifest.json
          if git diff --staged --quiet; then
            echo 'No changes in manifest.json'
          else
            git commit -m 'chore: auto-update ventes/manifest.json [skip ci]'
            git push
          fi
