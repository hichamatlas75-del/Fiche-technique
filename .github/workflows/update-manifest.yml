name: Update Ventes Manifest

on:
  push:
    paths:
      - 'ventes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest commits from remote
        run: |
          git pull --rebase origin main

      - name: Organize sales by month and generate manifest.json
        run: |
          node ./scripts/organize_and_update_manifest.js

      - name: Commit and push changes if needed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ventes/
          if git diff --staged --quiet; then
            echo 'Everything is already organized and manifest.json is up to date.'
          else
            git commit -m 'chore: auto-update ventes/manifest.json [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
