name: Update Ventes Manifest

on:
  push:
    paths:
      - 'ventes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest commits from remote
        run: |
          git pull --rebase origin main

      - name: Organize sales by month and generate manifest.json
        run: |
          node ./scripts/organize_and_update_manifest.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install xlrd openpyxl

      - name: Generate latest day sales JSON and update synthesis
        run: |
          python ./scripts/generate_latest_day.py

      - name: Sync latest sales to Supabase Cloud
        run: |
          python ./scripts/sync_sales_to_supabase.py --latest

      - name: Send daily summary to WhatsApp
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          python ./scripts/send_whatsapp_summary.py

      - name: Send daily summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ./scripts/send_telegram_summary.py

      - name: Commit and push changes if needed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ventes/ SYNTHESE_DECISIONNELLE_MENU.html
          if git diff --staged --quiet; then
            echo 'Everything is already organized and manifest.json is up to date.'
          else
            git commit -m 'chore: auto-update ventes manifest & dernier jour [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi

